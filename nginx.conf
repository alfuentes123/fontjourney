# Static-only nginx configuration for Font Journey.
# Designed to run as the unprivileged "nginx" user on a read-only root
# filesystem: every writable path points at /tmp (a tmpfs in compose.yaml).

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Stock mime.types has no entry for TrueType fonts.
    types {
        font/ttf  ttf;
    }

    access_log        /dev/stdout;
    server_tokens     off;
    sendfile          on;
    keepalive_timeout 30;

    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml font/ttf;

    # App shell and code revalidate on every load (ETag/Last-Modified) so edits
    # show up. Bundled fonts use stable filenames, so cache them for a week
    # (deliberately not "immutable").
    map $uri $cache_control {
        default      "no-cache";
        ~^/assets/   "public, max-age=604800";
    }

    server {
        listen       80 default_server;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Static site: only GET/HEAD make sense.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Everything is self-hosted: no external scripts, styles, fonts or
        # network requests. 'unsafe-inline' is allowed for styles only because
        # rich-text editing (contenteditable) and the color UI set inline styles.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control $cache_control always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Used by the container HEALTHCHECK.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
